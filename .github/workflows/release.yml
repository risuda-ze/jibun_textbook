name: Release

# production への push で、package.json の version からタグを打ち、同じ run でビルド1回 → Pages 配信と Release（zip）まで行う。
# 配信の合図は「リリース PR（develop → production）で package.json の version を上げること」。
#   - version を上げていない push（docs だけの修正など）は、タグが既にあるので tag ジョブだけで終わる（何も配信しない）
#   - 同じ version で2回目は出ない。タグは打ち直せない（Rulesets の version-rule）
# タグを同じ run の中で作るので、「GITHUB_TOKEN で push したタグは他の workflow を発火させない」問題に当たらない。
# 手動で配信し直す: Actions → Run workflow → tag に既存のタグ名（例: v0.2.1）。そのタグの内容でビルドし直して配信と Release を更新する。
# 注意: github-pages 環境の Deployment branches に production の許可が要る（run はブランチ push から始まるため）。docs/notes.md「配信」を参照。

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      tag:
        description: '配信し直す既存のタグ（例: v0.2.1）'
        required: true

# 配信は1本ずつ。走っている配信を止めずに後ろに並べる
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: タグ
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
      proceed: ${{ steps.tag.outputs.proceed }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::vX.Y.Z の形式ではありません: $tag"
            exit 1
          fi
          created=false
          if [ -z "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "::error::タグがありません: $tag"
              exit 1
            fi
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            created=true
          fi
          proceed=$created
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then proceed=true; fi
          echo "tag=$tag created=$created proceed=$proceed"
          printf 'tag=%s\ncreated=%s\nproceed=%s\n' "$tag" "$created" "$proceed" >> "$GITHUB_OUTPUT"

  build:
    name: ビルド
    needs: tag
    if: needs.tag.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 配信物が壊れていないことの最後の砦。CI と重複するが残す
      - run: npm test
      - run: npm run build
      # Pages 用（deploy）と Release の zip 用（release）。ビルドは1回なので、配信したサイトと zip は同じ成果物
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  deploy:
    name: Pages 配信
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Release
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: 成果物を zip にする
        run: |
          cd dist
          zip -r "../jibun_textbook-${TAG}.zip" .
          cd ..
          ls -l "jibun_textbook-${TAG}.zip"
      - name: Release を作成（既にあれば zip を差し替え）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: jibun_textbook-${{ env.TAG }}.zip
          generate_release_notes: true
          body: |
            ビルド成果物 `jibun_textbook-${{ env.TAG }}.zip` は `dist/` の中身です。
            `base` が `/jibun_textbook/` なので、解凍して直接開いても動きません。GitHub Pages 配下（https://risuda-ze.github.io/jibun_textbook/ ）で動く前提の成果物です。
            配信（Pages）はこの Release と同じ run の deploy ジョブで行われています。
