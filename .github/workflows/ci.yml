name: CI

# Pull Request と develop / production への push で、型・単体・ビルド・依存の脆弱性・通しを確かめる。
# push は develop と production だけに絞る。PR を開いているブランチで push と pull_request の両方が発火し、同じコミットで2回走るのを防ぐ。
# 配信はここでは行わない（deploy.yml が v* タグと手動でだけ配信する）。

on:
  push:
    branches: [develop, production]
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 型・単体・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 整形と lint（Biome）。整形ずれか lint のエラーがあれば失敗する（#86）
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # build は vite build だけ（型チェックは上で済ませているので二重に走らせない）
      - run: npm run build

  audit:
    name: 依存の脆弱性（high 以上で失敗）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # high 以上が1件でもあれば失敗させる。moderate 以下は Dependabot の更新 PR に任せる
      - run: npm audit --audit-level=high

  e2e:
    name: 通し（Playwright）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ブラウザは package-lock.json（Playwright の版）をキーにキャッシュする。当たれば install は数秒で終わる（#86）
      - uses: actions/cache@v5
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # デモ応答だけを使い、外部には一切つながない。API キーは不要
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
