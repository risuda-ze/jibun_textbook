name: Deploy to GitHub Pages

# 配信は v* タグを打ったときと、手動で実行したときだけ。ブランチへの push では配信しない。
# 手動実行では ref にタグ名（例: v0.1.0）を入れると、その時点の内容を配信し直せる。
# 注意: ワークフローはタグ先のコミットに入っている定義で動く。古いコミットにタグを打った場合は
# 自動では走らないので、production から手動実行して ref にそのタグを指定する。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: '配信するタグまたはコミット（空なら実行元）'
        required: false
        default: ''

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # タグからの配信は vX.Y.Z の形式だけを受け付ける。打ち間違い（v1 / V0.1.0 など）で配信しない。手動実行は対象外
      - name: タグ名を確認
        if: github.event_name == 'push'
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "タグ名が vX.Y.Z の形式ではありません: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # 配信物が壊れていないことの最後の砦。CI と重複するが残す
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
