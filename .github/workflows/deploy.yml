name: Deploy to GitHub Pages

# 配信は v* タグを打ったときと、手動で実行したときだけ。ブランチへの push では配信しない。
# 手動実行では ref にタグ名（例: v0.1.0）を入れると、その時点の内容を配信し直せる。
# 注意: ワークフローはタグ先のコミットに入っている定義で動く。古いコミットにタグを打った場合は
# 自動では走らないので、master から手動実行して ref にそのタグを指定する。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: '配信するタグまたはコミット（空なら実行元）'
        required: false
        default: ''

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # 配信物が壊れていないことの最後の砦。CI と重複するが残す
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
